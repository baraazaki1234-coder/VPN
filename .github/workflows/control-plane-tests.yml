name: Control Plane Tests

on:
  push:
    branches:
      - work/novra-vpn-foundation
    paths:
      - "server/**"
      - ".github/workflows/control-plane-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/control-plane-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run control-plane tests
        working-directory: server
        run: python -m unittest discover -s tests -v
